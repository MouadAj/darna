services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: housefamily
      POSTGRES_PASSWORD: housefamily
      POSTGRES_DB: housefamily
    ports:
      - "55432:5432"
    volumes:
      - housefamily-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housefamily -d housefamily"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  housefamily-postgres:
