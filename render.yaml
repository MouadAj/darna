# Import at https://dashboard.render.com/select-repo?type=blueprint
# Database is Neon Free, configured separately; no paid Render database is created.
services:
  - type: web
    name: darna-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.x
      - key: NODE_ENV
        value: production
      - key: DEV_AUTH_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
